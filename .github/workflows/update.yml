name: update

on:
  schedule:
    - cron: '10 21 * * 2'
  workflow_dispatch:

jobs:
  update:
    name: update recipes
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Create a new branch
        run: git checkout -b "update/recipes-$(date +%Y%m%d)"

      - name: Run update script
        run: python3 -u tools/update/update.py tools/update/recipes.yaml

      - name: Commit changes to recipes
        id: recipe-commit
        run: git commit --all --message="Recipe updates for $(date +%Y-%m-%d)"
        continue-on-error: true

      - name: Update rust dependencies
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        run: |
          sudo apt instal chrpath diffstat

          git submodule init
          git submodule update --single-branch --depth 1

          source oe-init-build-env
          bitbake -c update_crates bottom tacd ripgrep

      - name: Commit changes to rust dependencies
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        run: git commit --all --message="Rust crate update for $(date +%Y-%m-%d)"
        continue-on-error: true

      - name: Push changes upstream
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        run: git push --set-upstream origin

      - name: Create pull request
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr --base "${{ github.ref_name }}" --fill
